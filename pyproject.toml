[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronicle-plugin"
version = "5.0.0"
description = "Chronicle Plugins — event-sourced memory provider + memory-aware context engine for Hermes Agent"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["engine*", "plugins*"]
