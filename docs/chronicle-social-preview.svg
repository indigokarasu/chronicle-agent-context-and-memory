<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Chronicle for Hermes Agent</title>
  <desc id="desc">Local-first memory that survives long conversations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="120" r="210" fill="#2563eb" opacity=".10"/>
  <circle cx="1180" cy="540" r="270" fill="#7c3aed" opacity=".09"/>

  <g transform="translate(88 94)">
    <circle cx="88" cy="88" r="74" fill="none" stroke="#334155" stroke-width="4"/>
    <path d="M88 26 A62 62 0 1 1 42 46" fill="none" stroke="url(#line)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M88 48 V92 L121 112" fill="none" stroke="#f8fafc" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="88" cy="92" r="8" fill="#f8fafc"/>
  </g>

  <text x="300" y="170" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="92" font-weight="750" letter-spacing="-3">Chronicle</text>
  <text x="306" y="222" fill="#fbbf24" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="30" font-weight="650" letter-spacing="3">FOR HERMES AGENT</text>

  <text x="96" y="365" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="48" font-weight="600">Memory that survives long conversations.</text>
  <text x="98" y="425" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="29">Local-first · Event-sourced · No required services</text>

  <g transform="translate(96 500)">
    <rect width="1088" height="70" rx="14" fill="#070b16" stroke="#334155"/>
    <text x="26" y="44" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">hermes plugins install indigokarasu/chronicle-agent-context-and-memory</text>
  </g>
</svg>
