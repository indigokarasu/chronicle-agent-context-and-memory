name: chronicle
version: 5.0.0
description: "Chronicle Plugins — event-sourced memory provider + memory-aware context engine for Hermes Agent. Replaces ocas-elephas."
# Two plugins, one shared in-process core (§1.2). Either runs without the other.
memory_provider: plugins.memory_provider:ChronicleMemoryProvider
context_engine: plugins.context_engine:ChronicleContextEngine
entrypoint: plugins.memory_provider:ChronicleMemoryProvider
hooks:
  - sync_turn
  - on_session_end
  - on_pre_compress
  - on_memory_write
  - on_delegation
  - on_turn_start
  - on_session_switch
  - system_prompt_block
  - prefetch
  - queue_prefetch
# Full tool surface (§23); schemas served at runtime via get_tool_schemas.
tools:
  - chronicle_remember
  - chronicle_search
  - chronicle_answer
  - chronicle_ask_about
  - chronicle_timeline
  - chronicle_history
  - chronicle_get_context
  - chronicle_explain
  - chronicle_list_directives
  - chronicle_list_contradictions
  - chronicle_correct
  - chronicle_forget
  - chronicle_withdraw_consent
  - chronicle_verify
  - chronicle_grant_read
  - chronicle_revoke_read
  - chronicle_set_acl
  - chronicle_set_agent_privacy
  - chronicle_list_principals
  - chronicle_list_derivation_rules
  - chronicle_set_rule_enabled
  - chronicle_list_capabilities
  - chronicle_plan_context
  - chronicle_reflect
  - chronicle_remember_goal
  - chronicle_active_goals
  - chronicle_what_user_knows
  - chronicle_note_informed
  - chronicle_unmerge
  - chronicle_pin_context
  - chronicle_focus
config:
  memory:
    provider: chronicle
    store: sqlite
    db_path: ~/.hermes/commons/db/chronicle/chronicle.db
    git_repo: ~/.hermes/commons/db/chronicle/git
    git_remote: null
    embeddings:
      model: embeddinggemma-300m
      dimensions: 768
    vector_index:
      backend: sqlite-vec
      bruteforce_ceiling: 100000
    reaper:
      enabled: true
      schedule: "*/5 * * * *"
      idle_threshold: "20m"
      reap_threshold: "45m"
      startup_recovery: true
    extraction:
      version: "extractor-v1"
      promote_on_read: true
    retrieval:
      fts_weight: 0.4
      vector_weight: 0.6
      rrf_k: 60
      default_limit: 10
      raw_tier:
        enabled: true
    capture:
      sync_turn:
        mode: observe_only
    forgetting:
      raw_retention:
        keep_verbatim_days: 365
        then: gist
    health:
      schedule: "0 4 * * *"
    learning:
      max_active_deltas: 8
      max_delta_magnitude: 0.15
