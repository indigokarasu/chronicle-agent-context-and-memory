name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

# Several pushes can land on one release tag in quick succession (and a re-run
# of a tag overlaps the original). Without this, two runs for the same tag reach
# the publish step together, both see no release, and the second "create" loses
# the race and fails. Serialise per tag, and let a queued run run rather than be
# cancelled so a re-run still republishes the assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install pytest blake3 ruff
      - name: Verify release
        run: |
          python -m pytest tests/ -q
          ruff check .
      - name: Check tag matches plugin version
        shell: bash
        run: |
          set -euo pipefail
          plugin_version=$(awk '/^version:/ { print $2; exit }' plugin.yaml)
          if [[ "${GITHUB_REF_NAME}" != "v${plugin_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match plugin.yaml version ${plugin_version}" >&2
            exit 1
          fi
      - name: Build installable plugin bundle
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          mkdir -p dist/chronicle/dashboard
          cp __init__.py _base.py context.py provider.py plugin.yaml LICENSE README.md dist/chronicle/
          cp -R engine dist/chronicle/
          cp dashboard/manifest.json dashboard/plugin_api.py dashboard/tapestry_api.py dist/chronicle/dashboard/
          # the UI the manifest names (dist/index.js) and the Tapestry bundle it loads
          cp -R dashboard/dist dist/chronicle/dashboard/dist
          find dist -type f -name '*.pyc' -delete
          (cd dist && zip -qr "chronicle-${version}.zip" chronicle)
          (cd dist && shasum -a 256 "chronicle-${version}.zip" > "chronicle-${version}.zip.sha256")
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          # Idempotent: a re-run of a tag whose release already exists (the
          # burst pushes that trigger this workflow several times for one tag)
          # must not die with "a release with the same tag name already exists".
          # Re-running uploads the freshly built artifacts to the existing
          # release instead.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists — updating it."
            gh release upload "${GITHUB_REF_NAME}" \
              "dist/chronicle-${version}.zip" \
              "dist/chronicle-${version}.zip.sha256" \
              --clobber
            gh release edit "${GITHUB_REF_NAME}" --title "Chronicle ${version}"
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "dist/chronicle-${version}.zip" \
            "dist/chronicle-${version}.zip.sha256" \
            --verify-tag \
            --generate-notes \
            --title "Chronicle ${version}"
