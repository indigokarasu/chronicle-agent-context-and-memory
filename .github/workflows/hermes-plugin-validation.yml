name: Hermes Plugin Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: .hermes-validator
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # actions/checkout can only write inside the workspace, and the plugin
      # directory being validated IS the workspace: left there, the validator's
      # own repository is scanned as part of this plugin (4,282 findings, all in
      # Hermes's tests, docs and .mailmap). Move it out before validating.
      - name: Move the validator out of the plugin tree
        run: mv .hermes-validator "$RUNNER_TEMP/hermes-validator"
      # hermes_yaml does `from ruamel.yaml import YAML` at module scope, and
      # the validator import chain (plugin_validate -> plugins_manifest ->
      # utils/hermes_yaml) pulls it in before a single admission check runs.
      # Without it the job dies with ModuleNotFoundError: No module named
      # 'ruamel'. `packaging` is needed by pm.plugin_declarations, `pyyaml` by
      # the manifest loader's fast path.
      - name: Install validator dependencies
        run: python -m pip install --upgrade pyyaml packaging "ruamel.yaml>=0.18"
      - name: Validate against the Hermes plugin admission checks
        env:
          HERMES_VALIDATOR: ${{ runner.temp }}/hermes-validator
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, os.environ["HERMES_VALIDATOR"])
          from hermes_cli.plugin_validate import validate_plugin_dir

          report = validate_plugin_dir(Path("."))
          d = report.to_dict()
          # A failing check's detail can be enormous (the security scan lists
          # every finding in one string) and the Actions log drops everything
          # after such a line. Print details capped, then each failing check's
          # findings one per line, at most 200.
          for check in d.get("checks", []):
              full = str(check.get("detail", ""))
              check["detail"] = full if len(full) <= 300 else full[:300] + " ... (%d chars)" % len(full)
          print(json.dumps(d, indent=2))
          for check in report.to_dict().get("checks", []):
              if not check.get("ok", True):
                  parts = str(check.get("detail", "")).split(", ")
                  print("FAILED CHECK: %s (%d findings)" % (check.get("name"), len(parts)))
                  for part in parts[:200]:
                      print("   ", part[:200])
          sys.stdout.flush()
          raise SystemExit(report.exit_code)
          PY
